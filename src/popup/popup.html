<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adsenguisher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="Adsenguisher" class="logo">
        <div class="brand-text">
          <h1>Adsenguisher</h1>
          <span id="status-pill" class="pill pill-active">Ativo</span>
        </div>
      </div>
      <label class="switch" title="Ativar/Desativar proteção">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Nesta aba</span>
        <strong id="tab-blocked" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">Total bloqueado</span>
          <button id="btn-reset" class="icon-btn" title="Zerar estatísticas" aria-label="Zerar estatísticas">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
        </div>
        <strong id="total-blocked" class="stat-value">0</strong>
      </div>
    </section>

    <section id="features-panel" class="features">
      <label class="feature-row">
        <div class="feature-info">
          <span class="feature-title">Anúncios em vídeo</span>
          <span class="feature-desc">Pre-roll, mid-roll, overlays e skip</span>
        </div>
        <span class="switch switch-sm">
          <input type="checkbox" id="toggle-video" checked>
          <span class="slider"></span>
        </span>
      </label>

      <label class="feature-row">
        <div class="feature-info">
          <span class="feature-title">Feed, busca e banners</span>
          <span class="feature-desc">Slots promovidos e sidebar</span>
        </div>
        <span class="switch switch-sm">
          <input type="checkbox" id="toggle-feed" checked>
          <span class="slider"></span>
        </span>
      </label>

      <label class="feature-row">
        <div class="feature-info">
          <span class="feature-title">Anúncios em Shorts</span>
          <span class="feature-desc">Pula e remove anúncios no feed vertical</span>
        </div>
        <span class="switch switch-sm">
          <input type="checkbox" id="toggle-shorts" checked>
          <span class="slider"></span>
        </span>
      </label>

      <label class="feature-row">
        <div class="feature-info">
          <span class="feature-title">Escudo anti-adblock</span>
          <span class="feature-desc">Suprime avisos e bloqueios de reprodução</span>
        </div>
        <span class="switch switch-sm">
          <input type="checkbox" id="toggle-anti" checked>
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <footer class="footer">
      <button id="btn-reload" class="reload-btn">Recarregar aba</button>
      <span class="version">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
